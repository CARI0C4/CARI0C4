<svg xmlns="http://www.w3.org/2000/svg" width="900" height="36" viewBox="0 0 900 36" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- linhas laterais douradas -->
  <line x1="0"   y1="18" x2="360" y2="18" stroke="#c8a97e" stroke-width="0.8" opacity="0.6"/>
  <line x1="540" y1="18" x2="900" y2="18" stroke="#c8a97e" stroke-width="0.8" opacity="0.6"/>

  <!-- detalhes linha esquerda -->
  <line x1="0"   y1="14" x2="340" y2="14" stroke="#6b4d2a" stroke-width="0.4" opacity="0.4"/>
  <line x1="560" y1="14" x2="900" y2="14" stroke="#6b4d2a" stroke-width="0.4" opacity="0.4"/>

  <!-- diamantes decorativos na linha -->
  <polygon points="350,18 356,13 362,18 356,23" fill="#c8a97e" opacity="0.8"/>
  <polygon points="538,18 544,13 550,18 544,23" fill="#c8a97e" opacity="0.8"/>
  <polygon points="375,18 379,14 383,18 379,22" fill="#a08060" opacity="0.5"/>
  <polygon points="517,18 521,14 525,18 521,22" fill="#a08060" opacity="0.5"/>

  <!-- ornamento central — flor de lótus estilizada / símbolo P-Organ -->
  <g transform="translate(450,18)">
    <!-- pétalas externas -->
    <ellipse cx="0"   cy="-10" rx="3"   ry="8"   fill="none" stroke="#c8a97e" stroke-width="0.8" opacity="0.7" transform="rotate(0)"/>
    <ellipse cx="0"   cy="-10" rx="3"   ry="8"   fill="none" stroke="#c8a97e" stroke-width="0.8" opacity="0.7" transform="rotate(60)"/>
    <ellipse cx="0"   cy="-10" rx="3"   ry="8"   fill="none" stroke="#c8a97e" stroke-width="0.8" opacity="0.7" transform="rotate(120)"/>
    <ellipse cx="0"   cy="-10" rx="3"   ry="8"   fill="none" stroke="#c8a97e" stroke-width="0.8" opacity="0.7" transform="rotate(180)"/>
    <ellipse cx="0"   cy="-10" rx="3"   ry="8"   fill="none" stroke="#c8a97e" stroke-width="0.8" opacity="0.7" transform="rotate(240)"/>
    <ellipse cx="0"   cy="-10" rx="3"   ry="8"   fill="none" stroke="#c8a97e" stroke-width="0.8" opacity="0.7" transform="rotate(300)"/>
    <!-- centro -->
    <circle cx="0" cy="0" r="4" fill="#c8a97e" opacity="0.85"/>
    <circle cx="0" cy="0" r="2" fill="#1a1008" opacity="0.9"/>
  </g>

  <!-- pontos dourados de ritmo -->
  <circle cx="400" cy="18" r="1.5" fill="#c8a97e" opacity="0.6"/>
  <circle cx="413" cy="18" r="1"   fill="#a08060" opacity="0.5"/>
  <circle cx="487" cy="18" r="1"   fill="#a08060" opacity="0.5"/>
  <circle cx="500" cy="18" r="1.5" fill="#c8a97e" opacity="0.6"/>
</svg>
